<script>
document.addEventListener('DOMContentLoaded', function(){
  let currentSlide = 0;
  let isMobile = false;
  let originalHTML = '';

  const container = document.querySelector('.wine-carousel-container');
  const wrapper = document.querySelector('.wine-carousel-wrapper');

  function checkMobile() {
    return window.innerWidth <= 768;
  }

  function createMobileView() {
    // Save original HTML if not saved yet
    if (!originalHTML) {
      originalHTML = wrapper.innerHTML;
    }

    // Get all wine items organized by category
    const categories = [];
    const wineSlides = wrapper.querySelectorAll('.wine-slide');

    wineSlides.forEach(function(slide) {
      const slideTitle = slide.querySelector('.group-title').textContent;
      const wines = [];
      const wineItems = slide.querySelectorAll('.wine-item');

      wineItems.forEach(function(item) {
        // Skip "In Arrivo" items in mobile view
        if (item.dataset.name !== 'In Arrivo') {
          wines.push(item.cloneNode(true));
        }
      });

      if (wines.length > 0) {
        // Extract just the category name (e.g., "Vini Rossi" from "Vini Rossi (1/4)")
        const categoryName = slideTitle.split('(')[0].trim();

        categories.push({
          title: categoryName,
          wines: wines
        });
      }
    });

    // Create new slides with 3 wines each, grouped by category
    let newHTML = '';
    categories.forEach(category => {
      for (let i = 0; i < category.wines.length; i += 3) {
        const group = category.wines.slice(i, Math.min(i + 3, category.wines.length));

        newHTML += `<div class="wine-slide">
          <h4 class="group-title">${category.title}</h4>
          <div class="shelf-wrapper">`;

        group.forEach(wine => {
          newHTML += wine.outerHTML;
        });

        newHTML += `</div></div>`;
      }
    });

    wrapper.innerHTML = newHTML;
  }

  function restoreDesktopView() {
    if (originalHTML) {
      wrapper.innerHTML = originalHTML;
    }
  }

  function updateCarousel() {
    wrapper.style.transform = 'translateX(' + (-currentSlide * 100) + '%)';
  }

  function getTotalSlides() {
    return wrapper.querySelectorAll('.wine-slide').length;
  }

  function handleResize() {
    const wasMobile = isMobile;
    isMobile = checkMobile();

    if (isMobile !== wasMobile) {
      currentSlide = 0;
      if (isMobile) {
        createMobileView();
      } else {
        restoreDesktopView();
      }
      updateCarousel();
    }
  }

  // Initialize
  isMobile = checkMobile();
  if (isMobile) {
    createMobileView();
  }
  updateCarousel();

  window.addEventListener('resize', handleResize);

  const nextBtn = document.querySelector('.arrow.next');
  const prevBtn = document.querySelector('.arrow.prev');

  nextBtn.addEventListener('click', function() {
    const total = getTotalSlides();
    currentSlide = (currentSlide + 1) % total;
    updateCarousel();
  });

  prevBtn.addEventListener('click', function() {
    const total = getTotalSlides();
    currentSlide = (currentSlide - 1 + total) % total;
    updateCarousel();
  });

  // Logica del Tooltip
  const tooltip = document.querySelector('.tooltip-preview');
  let activeTooltip = null;

  function showTooltip(item) {
    const name = item.dataset.name;
    const img = item.dataset.img;
    const desc = item.dataset.desc;

    const content = `
      <div class="tooltip-content">
        <img src="${img}" alt="${name}">
        <div class="tooltip-text">
          <h4>${name}</h4>
          <p>${desc}</p>
        </div>
      </div>
    `;

    tooltip.innerHTML = content;
    tooltip.style.display = 'block';

    const itemRect = item.getBoundingClientRect();
    const top = itemRect.top + itemRect.height + 10;
    let left = itemRect.left + (itemRect.width / 2) - (tooltip.offsetWidth / 2);

    if (left < 10) left = 10;
    if (left + tooltip.offsetWidth > window.innerWidth - 10) {
        left = window.innerWidth - tooltip.offsetWidth - 10;
    }

    tooltip.style.top = top + 'px';
    tooltip.style.left = left + 'px';
    activeTooltip = item;
  }

  function hideTooltip() {
    tooltip.style.display = 'none';
    activeTooltip = null;
  }

  // Desktop: hover
  document.addEventListener('mouseenter', function(e) {
    if (e.target.closest('.wine-item') && !isMobile) {
      showTooltip(e.target.closest('.wine-item'));
    }
  }, true);

  document.addEventListener('mouseleave', function(e) {
    if (e.target.closest('.wine-item') && !isMobile) {
      hideTooltip();
    }
  }, true);

  // Mobile: touch events
  let touchStartTime = 0;

  document.addEventListener('touchstart', function(e) {
    touchStartTime = Date.now();
    const wineItem = e.target.closest('.wine-item');

    if (isMobile && wineItem) {
      // Previeni solo se non è un gesto di scroll
      const touch = e.touches[0];
      wineItem.touchStartX = touch.clientX;
      wineItem.touchStartY = touch.clientY;
    }
  }, { passive: true });

  document.addEventListener('touchend', function(e) {
    const wineItem = e.target.closest('.wine-item');
    const touchDuration = Date.now() - touchStartTime;

    if (isMobile && wineItem && touchDuration < 500) {
      // Verifica che non sia uno scroll
      const touch = e.changedTouches[0];
      const deltaX = Math.abs(touch.clientX - (wineItem.touchStartX || 0));
      const deltaY = Math.abs(touch.clientY - (wineItem.touchStartY || 0));

      if (deltaX < 10 && deltaY < 10) {
        // È un tap, non uno scroll
        if (activeTooltip === wineItem) {
          hideTooltip();
        } else {
          showTooltip(wineItem);
        }
        e.preventDefault();
      }
    } else if (isMobile && !e.target.closest('.tooltip-preview') && !wineItem) {
      // Touch fuori dal tooltip, chiudi
      hideTooltip();
    }
  });

  // Mobile menu toggle
  const menuToggle = document.querySelector('.menu-toggle');
  const mainNav = document.querySelector('.main-nav');

  menuToggle.addEventListener('click', function() {
    mainNav.classList.toggle('active');
  });
});
</script>

</body>
</html>
